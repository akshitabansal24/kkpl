<!-- Banner Section -->
<section id="banner" class="content-section p-4 block">

    <div id="carouselExampleInterval" class="carousel carousel-dark slide " data-bs-ride="carousel">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="0" class="active"
                aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="1"

            <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="2"

            <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="3"

            <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="4"
                aria-label="Slide 5"></button>
            <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="5"
                aria-label="Slide 6"></button>
            <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="6"
                aria-label="Slide 7"></button>
        </div>
        <div class="carousel-inner w-75 mx-auto">
            <div class="carousel-item active" data-bs-interval="2000">
                <img src="../../assets/img/silk.jpg" class="d-block w-50 mx-auto " alt="...">
            </div>
            <div class="carousel-item " data-bs-interval="2000">
                <img src="../../assets/img/chiffon.jpg" class="d-block w-50 mx-auto" alt="...">
            </div>
            <div class="carousel-item " data-bs-interval="2000">
                <img src="../../assets/img/cotton.jpg" class="d-block w-50 mx-auto" alt="...">
            </div>
            <div class="carousel-item " data-bs-interval="2000">
                <img src="../../assets/img/georgette.jpg" class="d-block w-50 mx-auto" alt="...">

            <div class="carousel-item " data-bs-interval="2000">
                <img src="../../assets/img/linen.jpg" class="d-block w-50 mx-auto" alt="...">
            </div>
            <div class="carousel-item" data-bs-interval="2000">
                <img src="../../assets/img/muslin.jpg" class="d-block w-50 mx-auto" alt="...">
            </div>
            <div class="carousel-item" data-bs-interval="2000">
                <img src="../../assets/img/organza.jpg" class="d-block w-50 mx-auto" alt="...">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleInterval"
            data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleInterval"

            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
